# Keeps the published Vim tips file in sync with its sources.
#
# tips/vim_tips_min.json is a generated artifact and is never authored by hand.
# It is always produced from the files in tips/categories/ by
# scripts/generate-tips.mjs. PRs only validate, since fork PR tokens can't push;
# pushes to main regenerate and commit.

name: Generate Tips

on:
  push:
    branches: [ main ]
    paths:
      - 'tips/categories/**'
      - 'scripts/generate-tips.mjs'
      - 'scripts/tip-keys*.mjs'
      - '.github/workflows/generate-tips.yml'
  pull_request:
    paths:
      - 'tips/categories/**'
      - 'scripts/generate-tips.mjs'
      - 'scripts/tip-keys*.mjs'
      - '.github/workflows/generate-tips.yml'

jobs:
  check:
    name: Validate tip sources
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Test the key-marker parser
        run: node --test scripts/tip-keys.test.mjs

      - name: Validate tips/categories
        run: node scripts/generate-tips.mjs --check

  generate:
    name: Generate vim_tips_min.json
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate vim_tips_min.json
        run: node scripts/generate-tips.mjs

      - name: Commit regenerated file
        run: |
          if git diff --quiet tips/vim_tips_min.json; then
            echo "tips/vim_tips_min.json already up to date."
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add tips/vim_tips_min.json
            git commit -m "chore: regenerate vim_tips_min.json from category sources [skip ci]"
            git push
          fi
